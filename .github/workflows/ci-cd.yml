name: CI/CD

on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/live/**"
      - "AzureFunctionTest/**"
      - "AzureFunction.Business/**"
      - "AzureFunction.Domain/**"
      - "AzureFunction.DataAccess/**"
  push:
    branches: [main]
    paths:
      - "infrastructure/live/**"
      - "AzureFunctionTest/**"
      - "AzureFunction.Business/**"
      - "AzureFunction.Domain/**"
      - "AzureFunction.DataAccess/**"

permissions:
  id-token: write
  contents: read

# terraform-plan y terraform-apply comparten el mismo backend/state (infrastructure/live
# -> iactest.dev.tfstate). Sin esto, dos runs simultáneos (ej. dos pushes seguidos a un PR)
# pelean por el blob lease y uno falla con "state blob is already locked". cancel-in-progress
# queda en false a propósito: cancelar un run a mitad de un `apply` puede dejar el lock
# colgado igual, así que preferimos encolar en vez de cortar.
concurrency:
  group: terraform-live
  cancel-in-progress: false

env:
  TF_DIR: infrastructure/live
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"

jobs:
  terraform-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: terraform fmt
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -var-file=environments/dev.tfvars -input=false

  terraform-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      function_app_name: ${{ steps.tf_output.outputs.function_app_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve -var-file=environments/dev.tfvars -input=false

      - id: tf_output
        name: read function app name
        working-directory: ${{ env.TF_DIR }}
        run: echo "function_app_name=$(terraform output -raw function_app_name)" >> "$GITHUB_OUTPUT"

  deploy-function:
    needs: terraform-apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: publish
        run: dotnet publish AzureFunctionTest/AzureFunctionTest.csproj -c Release -o ./publish

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.terraform-apply.outputs.function_app_name }}
          package: ./publish
